<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gate Inbox — ml-os</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0d12; --bg-glow: rgba(122, 162, 255, .07);
    --surface: #11151c; --surface-2: #171c25; --surface-3: #1d232e;
    --border: #212836; --hairline: #1a202b;
    --text: #e7ebf3; --dim: #9aa4b5; --faint: #5f6a7d;
    --accent: #7aa2ff;
    --plan: #a78bfa; --code: #3ecf8e; --blocked: #f87171; --stale: #f5b043;
    --ready: #58a6ff; --backlog: #7d8797; --inprogress: #e0913a;
    --ok: #3ecf8e;
    --shadow: 0 1px 2px rgba(0,0,0,.45), 0 8px 28px rgba(0,0,0,.28);
    --radius: 14px;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f4f6f9; --bg-glow: rgba(58, 99, 240, .05);
      --surface: #ffffff; --surface-2: #f2f4f8; --surface-3: #e9edf3;
      --border: #dde2ea; --hairline: #e7ebf1;
      --text: #141924; --dim: #566173; --faint: #8a93a4;
      --accent: #3a63f0;
      --plan: #6d43ff; --code: #0e9e63; --blocked: #d64540; --stale: #b3720f;
      --ready: #1f6feb; --backlog: #8a93a4; --inprogress: #b5751d;
      --ok: #0e9e63;
      --shadow: 0 1px 2px rgba(20,30,60,.05), 0 10px 30px rgba(20,30,60,.07);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text);
    background: var(--bg);
    background-image: radial-gradient(52rem 26rem at 50% -8rem, var(--bg-glow), transparent 70%);
    background-repeat: no-repeat;
    font: 15px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  /* ── App bar ── */
  .appbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 14px;
    padding: 13px 24px; border-bottom: 1px solid var(--hairline);
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    backdrop-filter: saturate(140%) blur(12px);
  }
  .brand { display: flex; align-items: baseline; gap: 11px; }
  .brand-name {
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase;
  }
  .brand-sub { font-family: var(--mono); font-size: 11px; color: var(--faint); letter-spacing: .08em; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
    align-self: center; flex: none; margin-right: -1px;
  }
  .dot.waiting { background: var(--stale); animation: pulse 2s infinite; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--stale) 55%, transparent); }
    70%  { box-shadow: 0 0 0 7px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .appbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .chip {
    font-family: var(--mono); font-size: 10.5px; color: var(--faint);
    text-transform: uppercase; letter-spacing: .1em;
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px;
  }

  main { max-width: 980px; margin: 0 auto; padding: 26px 24px 88px; }

  /* ── Triage hero ── */
  .hero {
    display: flex; align-items: center; gap: 18px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); box-shadow: var(--shadow);
    padding: 20px 24px; margin-bottom: 30px;
  }
  .hero-count {
    font-family: var(--mono); font-size: 44px; font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
    color: var(--stale); min-width: 1.2ch; text-align: center;
  }
  .hero.clear .hero-glyph {
    font-size: 26px; color: var(--ok); line-height: 1;
    width: 52px; height: 52px; flex: none;
    display: grid; place-items: center; border-radius: 50%;
    background: color-mix(in srgb, var(--ok) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent);
  }
  .hero-line { font-size: 17px; font-weight: 640; letter-spacing: -.01em; }
  .hero-meta { font-family: var(--mono); font-size: 12px; color: var(--dim); margin-top: 4px; letter-spacing: .02em; }
  .hero-meta .sep { color: var(--faint); padding: 0 5px; }
  .hero-meta .m-stale { color: var(--stale); font-weight: 700; }

  /* ── Section labels ── */
  .section-label {
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .14em; color: var(--faint);
    margin: 34px 2px 12px; display: flex; align-items: center; gap: 10px;
  }
  .section-label:first-child { margin-top: 0; }
  .section-label .n { color: var(--dim); }
  .section-label::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }

  /* ── Gate cards ── */
  .gate {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: var(--radius); padding: 13px 16px 13px 14px; margin-bottom: 10px;
    cursor: pointer; box-shadow: var(--shadow);
    transition: transform .1s ease, background .12s ease, border-color .12s ease;
  }
  .gate:hover {
    background: var(--surface-2); transform: translateY(-1px);
    border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
  }
  .gate.t-plan { border-left-color: var(--plan); }
  .gate.t-code { border-left-color: var(--code); }
  .gate.t-inferred { border-left-color: var(--faint); border-left-style: dashed; }
  .gate.t-inferred .proj, .gate.t-inferred .gtitle { opacity: .85; }
  .gchip {
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    padding: 4px 8px; border-radius: 6px; color: #fff; flex: none;
  }
  .gchip.plan { background: var(--plan); }
  .gchip.code { background: var(--code); }
  .gchip.inferred { background: transparent; color: var(--faint); border: 1px dashed var(--faint); }
  .gmain { min-width: 0; }
  .grow1 { display: flex; align-items: baseline; gap: 8px; }
  .proj { font-weight: 650; letter-spacing: -.01em; }
  .tnum { font-family: var(--mono); font-size: 12.5px; color: var(--dim); }
  .stale-tag {
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em; color: var(--stale);
    border: 1px solid color-mix(in srgb, var(--stale) 45%, transparent);
    background: color-mix(in srgb, var(--stale) 12%, transparent);
    border-radius: 5px; padding: 1.5px 6px;
  }
  .uncertain { font-size: 11.5px; color: var(--faint); font-style: italic; }
  .gtitle {
    font-size: 13px; color: var(--dim); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .gate .spacer { flex: 1; }
  .gwait { text-align: right; flex: none; }
  .age {
    font-family: var(--mono); font-size: 17px; font-weight: 650;
    font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap;
  }
  .gate.stale .age { color: var(--stale); }
  .wlabel { font-family: var(--mono); font-size: 10px; color: var(--faint);
            text-transform: uppercase; letter-spacing: .12em; margin-top: 1px; }
  .chain-btn {
    flex: none; font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
    color: var(--dim); background: transparent;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 11px; cursor: pointer; transition: all .12s ease;
  }
  .chain-btn:hover { color: var(--text); border-color: var(--accent); background: var(--surface); }
  .jump-hint { color: var(--faint); font-size: 16px; opacity: 0; transition: opacity .12s ease; flex: none; }
  .gate:hover .jump-hint { opacity: 1; color: var(--accent); }

  /* ── Project boards ── */
  .board {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden; margin-bottom: 16px;
  }
  .board-head {
    display: flex; align-items: baseline; gap: 12px;
    padding: 13px 16px; background: var(--surface-2);
    border-bottom: 1px solid var(--hairline);
  }
  .board-head .name { font-weight: 650; font-size: 15px; letter-spacing: -.01em; }
  .board-head .meta { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
  .board-head .meta .b-blockers { color: var(--blocked); }
  .notinit {
    font-family: var(--mono); font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    padding: 3px 8px; border-radius: 5px; color: var(--faint);
    border: 1px dashed var(--border); margin-left: auto;
  }
  .board-body-note { padding: 14px 16px; color: var(--faint); font-size: 13px; }
  .table-scroll { overflow-x: auto; }
  table.board-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.board-table th {
    text-align: left; color: var(--faint); font-family: var(--mono);
    font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
    padding: 8px 16px; border-bottom: 1px solid var(--hairline); white-space: nowrap;
  }
  table.board-table td { padding: 10px 16px; border-top: 1px solid var(--hairline); vertical-align: middle; }
  table.board-table tbody tr:first-child td { border-top: none; }
  table.board-table tbody tr { cursor: pointer; transition: background .1s ease; }
  table.board-table tbody tr:hover { background: var(--surface-2); }
  td.num { font-family: var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; width: 2.5em; }
  td.title { width: 100%; }
  td.agent { color: var(--dim); font-family: var(--mono); font-size: 12.5px; }
  .status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 650; letter-spacing: .01em;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    border: 1px solid transparent;
  }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status .kw { text-transform: uppercase; letter-spacing: .05em; font-family: var(--mono); font-size: 10.5px; }
  .status .sha { font-family: var(--mono); font-size: 10.5px; font-weight: 600; opacity: .8; }
  .status.done        { color: var(--code);       background: color-mix(in srgb, var(--code) 13%, transparent);       border-color: color-mix(in srgb, var(--code) 30%, transparent); }
  .status.ready       { color: var(--ready);      background: color-mix(in srgb, var(--ready) 13%, transparent);      border-color: color-mix(in srgb, var(--ready) 30%, transparent); }
  .status.in-progress { color: var(--inprogress); background: color-mix(in srgb, var(--inprogress) 14%, transparent); border-color: color-mix(in srgb, var(--inprogress) 32%, transparent); }
  .status.blocked     { color: var(--blocked);    background: color-mix(in srgb, var(--blocked) 13%, transparent);    border-color: color-mix(in srgb, var(--blocked) 32%, transparent); }
  .status.backlog,
  .status.unknown     { color: var(--backlog);    background: var(--surface-2); border-color: var(--border); }
  td.blocked-by { font-family: var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .empty-board { color: var(--faint); font-size: 13.5px; padding: 16px; background: var(--surface);
                 border: 1px solid var(--border); border-radius: var(--radius); }
  .blockers { border-top: 1px solid var(--hairline); }
  .blocker {
    font-size: 13px; padding: 10px 16px;
    background: color-mix(in srgb, var(--blocked) 7%, var(--surface));
    border-top: 1px solid color-mix(in srgb, var(--blocked) 18%, var(--hairline));
    color: var(--text);
  }
  .blocker:first-child { border-top: none; }
  .blocker .bid { font-weight: 700; color: var(--blocked); font-family: var(--mono); margin-right: 4px; }
  .blocker .bmeta { color: var(--dim); font-size: 12px; }

  /* ── Chain drawer ── */
  #chain-backdrop { display: none; position: fixed; inset: 0; z-index: 10;
                    background: rgba(0,0,0,.5); backdrop-filter: blur(2px); }
  #chain-backdrop.open { display: block; }
  #chain-drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: min(660px, 100%); z-index: 11;
    background: var(--bg); border-left: 1px solid var(--border);
    transform: translateX(100%); transition: transform .22s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column; box-shadow: -24px 0 60px rgba(0,0,0,.4);
  }
  #chain-drawer.open { transform: translateX(0); }
  .chain-head { display: flex; align-items: center; gap: 12px; padding: 15px 22px;
                border-bottom: 1px solid var(--hairline); background: var(--surface); }
  .chain-head .ch-label {
    font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--faint);
    text-transform: uppercase; letter-spacing: .14em;
  }
  .chain-head h3 { margin: 0; font-size: 15px; flex: 1; font-weight: 650; letter-spacing: -.01em; }
  .chain-head h3 .tnum { font-family: var(--mono); font-size: 13px; color: var(--dim); font-weight: 600; }
  .chain-close { cursor: pointer; border: 1px solid var(--border); background: var(--surface-2);
                 color: var(--dim); border-radius: 8px; padding: 5px 12px; font-size: 13px; }
  .chain-close:hover { color: var(--text); border-color: var(--accent); }
  .chain-body { overflow-y: auto; padding: 24px 22px 40px; }

  /* timeline: plan → handoffs → commits */
  .tl { position: relative; padding-left: 26px; }
  .tl::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px;
                width: 2px; background: var(--hairline); border-radius: 1px; }
  .tl-node { position: relative; margin-bottom: 30px; }
  .tl-node:last-child { margin-bottom: 0; }
  .tl-dot {
    position: absolute; left: -26px; top: 3px; width: 16px; height: 16px;
    border-radius: 50%; background: var(--bg); z-index: 1;
    border: 2px solid var(--faint);
  }
  .tl-node.n-plan    .tl-dot { border-color: var(--plan); }
  .tl-node.n-handoff .tl-dot { border-color: var(--accent); }
  .tl-node.n-commit  .tl-dot { border-color: var(--code); }
  .tl-node h4 {
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .14em; color: var(--dim);
    margin: 0 0 12px;
  }
  .tl-node h4 .n { color: var(--faint); font-weight: 600; }
  .commit { font-size: 13.5px; padding: 7px 0; display: flex; gap: 10px; align-items: baseline;
            border-top: 1px solid var(--hairline); }
  .commit:first-of-type { border-top: none; }
  .commit .sha { font-family: var(--mono); color: var(--code); font-weight: 650; flex: none; font-size: 12.5px; }
  .handoff-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
                  padding: 12px 14px; margin-bottom: 9px; font-size: 13.5px; box-shadow: var(--shadow); }
  .handoff-card .hmeta { font-family: var(--mono); color: var(--faint); font-size: 11.5px; margin-bottom: 6px; }
  .handoff-card .hmeta .arrow { color: var(--accent); }
  .handoff-card .hdetail { color: var(--dim); white-space: pre-wrap; margin-top: 6px; font-size: 12.5px; }
  details.plan-file { margin-bottom: 10px; background: var(--surface); border: 1px solid var(--border);
                      border-radius: 10px; overflow: hidden; box-shadow: var(--shadow); }
  details.plan-file summary {
    cursor: pointer; padding: 10px 14px; font-family: var(--mono); font-size: 12.5px;
    font-weight: 650; color: var(--text); list-style: none; display: flex; align-items: center; gap: 8px;
  }
  details.plan-file summary::-webkit-details-marker { display: none; }
  details.plan-file summary::before {
    content: "▸"; color: var(--faint); font-size: 11px; transition: transform .12s ease;
  }
  details.plan-file[open] summary::before { transform: rotate(90deg); }
  details.plan-file summary:hover { background: var(--surface-2); }
  details.plan-file pre {
    margin: 0; padding: 12px 14px; border-top: 1px solid var(--hairline);
    overflow-x: auto; font-size: 12px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word;
    font-family: var(--mono); color: var(--dim);
  }
  .chain-empty { color: var(--faint); font-size: 13px; }
  .chain-empty.err { color: var(--blocked); }

  /* ── Status bar ── */
  footer { position: fixed; bottom: 0; left: 0; right: 0; z-index: 4;
           display: flex; align-items: center; gap: 8px;
           padding: 8px 24px; font-family: var(--mono); font-size: 11px;
           letter-spacing: .03em; color: var(--faint);
           background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(10px);
           border-top: 1px solid var(--hairline); }
  footer .live { color: var(--ok); }
  footer.err, footer.err .live { color: var(--stale); }

  /* ── Small screens ── */
  @media (max-width: 640px) {
    main { padding: 18px 14px 80px; }
    .appbar { padding: 12px 16px; }
    .hero { padding: 16px; gap: 14px; }
    .hero-count { font-size: 34px; }
    .gate { flex-wrap: wrap; row-gap: 8px; }
    .gmain { flex: 1 1 100%; order: 2; }
    .gwait { order: 1; margin-left: auto; }
    .gchip { order: 0; }
    .chain-btn { order: 3; }
    .jump-hint { display: none; }
    footer { padding: 8px 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header class="appbar">
  <div class="brand">
    <span class="dot" id="status-dot"></span>
    <span class="brand-name">Gate Inbox</span>
    <span class="brand-sub">ml-os</span>
  </div>
  <div class="appbar-right">
    <span class="chip">read-only</span>
  </div>
</header>

<main>
  <section id="hero" aria-live="polite"></section>
  <div class="section-label" id="gates-label" hidden>Pending gates <span class="n" id="gates-n"></span></div>
  <div id="gates"></div>
  <div class="section-label">Projects <span class="n" id="boards-n"></span></div>
  <div id="boards"></div>
</main>

<footer id="footer"><span class="live">●</span><span id="footer-text">ml-os · read-only</span></footer>

<div id="chain-backdrop"></div>
<aside id="chain-drawer" aria-hidden="true">
  <div class="chain-head">
    <span class="ch-label">Trace</span>
    <h3 id="chain-title">Chain</h3>
    <button class="chain-close" id="chain-close" aria-label="Close trace chain">Close</button>
  </div>
  <div class="chain-body" id="chain-body"></div>
</aside>

<script>
"use strict";

function fmtAge(seconds) {
  const s = Math.max(0, Math.floor(seconds));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h >= 24) { const d = Math.floor(h / 24); return d + "d " + (h % 24) + "h"; }
  if (h > 0) return h + "h " + m + "m";
  if (m > 0) return m + "m";
  return sec + "s";
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

// Ages tick locally between polls; each element carries its server-reported base age.
let agesFetchedAt = performance.now();

function tickAges() {
  const dt = (performance.now() - agesFetchedAt) / 1000;
  for (const el of document.querySelectorAll("[data-age]")) {
    el.textContent = fmtAge(parseFloat(el.dataset.age) + dt);
  }
}
setInterval(tickAges, 1000);

// Task titles come from board data, keyed repo+num, so gate cards can show context.
function taskTitleMap(boards) {
  const m = new Map();
  for (const b of boards) {
    for (const t of (b.tasks || [])) m.set(b.repo + "␀" + t.num, t.title);
  }
  return m;
}

function render(state) {
  const gates = state.gates || [];
  const boards = state.boards || [];
  const dot = document.getElementById("status-dot");

  document.title = gates.length > 0
    ? "(" + gates.length + ") Gate Inbox — ml-os"
    : "Gate Inbox — ml-os";
  dot.classList.toggle("waiting", gates.length > 0);

  agesFetchedAt = performance.now();
  const titles = taskTitleMap(boards);
  renderHero(gates);
  renderGates(gates, titles);
  renderBoards(boards);
}

function renderHero(gates) {
  const hero = document.getElementById("hero");
  if (gates.length === 0) {
    hero.innerHTML =
      '<div class="hero clear">' +
        '<span class="hero-glyph">✓</span>' +
        '<div><div class="hero-line">All clear</div>' +
        '<div class="hero-meta">No gate is waiting on you — cycles surface here the moment they need a decision.</div></div>' +
      '</div>';
    return;
  }
  const oldest = gates[0]; // server sorts oldest-first
  const nPlan = gates.filter(g => g.source !== "inferred" && g.gate_type === "plan").length;
  const nCode = gates.filter(g => g.source !== "inferred" && g.gate_type === "code").length;
  const nInf = gates.filter(g => g.source === "inferred").length;
  const nStale = gates.filter(g => g.stale).length;
  const parts = [];
  parts.push('oldest <span data-age="' + oldest.age_seconds + '">' + fmtAge(oldest.age_seconds) + '</span>');
  if (nPlan) parts.push(nPlan + " plan");
  if (nCode) parts.push(nCode + " code");
  if (nInf) parts.push(nInf + " inferred");
  if (nStale) parts.push('<span class="m-stale">' + nStale + " stale</span>");
  hero.innerHTML =
    '<div class="hero has">' +
      '<div class="hero-count">' + gates.length + '</div>' +
      '<div><div class="hero-line">' + (gates.length === 1 ? "gate is waiting on you" : "gates are waiting on you") + '</div>' +
      '<div class="hero-meta">' + parts.join('<span class="sep">·</span>') + '</div></div>' +
    '</div>';
}

function renderGates(gates, titles) {
  const label = document.getElementById("gates-label");
  const container = document.getElementById("gates");
  label.hidden = gates.length === 0;
  document.getElementById("gates-n").textContent = gates.length ? "· " + gates.length : "";
  container.innerHTML = "";
  for (const g of gates) {
    const inferred = g.source === "inferred";
    const typeClass = inferred ? "t-inferred" : (g.gate_type === "code" ? "t-code" : "t-plan");
    const row = document.createElement("article");
    row.className = "gate " + typeClass + (g.stale ? " stale" : "");
    row.dataset.jumpRepo = g.repo;
    row.setAttribute("role", "button");
    row.tabIndex = 0;
    row.title = inferred
      ? "inferred — no gate marker; a /go cycle may be waiting (not certain). Click to jump."
      : "click to jump to " + g.repo + "'s session";
    const chipClass = inferred ? "inferred" : (g.gate_type === "code" ? "code" : "plan");
    const chipText = inferred ? "inferred?" : g.gate_type;
    const title = titles.get(g.repo + "␀" + g.task);
    row.innerHTML =
      '<span class="gchip ' + chipClass + '">' + escapeHtml(chipText) + '</span>' +
      '<div class="gmain">' +
        '<div class="grow1">' +
          '<span class="proj">' + escapeHtml(g.repo) + '</span>' +
          '<span class="tnum">#' + escapeHtml(g.task) + '</span>' +
          (g.stale ? '<span class="stale-tag">stale</span>' : '') +
          (inferred ? '<span class="uncertain">not certain</span>' : '') +
        '</div>' +
        (title ? '<div class="gtitle">' + escapeHtml(title) + '</div>' : '') +
      '</div>' +
      '<span class="spacer"></span>' +
      '<div class="gwait">' +
        '<div class="age" data-age="' + g.age_seconds + '" title="since ' + escapeHtml(g.since) + '">' +
          fmtAge(g.age_seconds) + '</div>' +
        '<div class="wlabel">waiting</div>' +
      '</div>' +
      '<button class="chain-btn" data-chain-repo="' + escapeHtml(g.repo) +
        '" data-chain-task="' + escapeHtml(g.task) + '" title="view trace chain">trace</button>' +
      '<span class="jump-hint" aria-hidden="true">↗</span>';
    container.appendChild(row);
  }
}

function statusClass(keyword) {
  const known = ["done", "ready", "in-progress", "blocked", "backlog"];
  const k = String(keyword || "").toLowerCase().replace(/\s+/g, "-");
  return known.includes(k) ? k : "unknown";
}

// Split a status like "DONE (bceb592)" into keyword + optional sha for styled rendering.
function statusHtml(status, keyword) {
  const m = String(status).match(/^([^(]+?)\s*\(([^)]+)\)\s*$/);
  const kw = '<span class="kw">' + escapeHtml(m ? m[1].trim() : status) + '</span>';
  const sha = m ? ' <span class="sha">' + escapeHtml(m[2]) + '</span>' : '';
  return '<span class="status ' + statusClass(keyword) + '">' + kw + sha + '</span>';
}

function renderBoards(boards) {
  const host = document.getElementById("boards");
  document.getElementById("boards-n").textContent = boards.length ? "· " + boards.length : "";
  if (boards.length === 0) {
    host.innerHTML = '<div class="empty-board">No projects registered.</div>';
    return;
  }
  host.innerHTML = "";
  for (const b of boards) {
    const card = document.createElement("section");
    card.className = "board";
    let head = '<header class="board-head"><span class="name">' + escapeHtml(b.repo) + '</span>';
    if (!b.initialized) {
      card.innerHTML = head + '<span class="notinit">not initialized</span></header>' +
        '<div class="board-body-note">No .ay directory yet — this project appears once a /go cycle initializes it.</div>';
      host.appendChild(card);
      continue;
    }
    const meta = b.tasks.length + (b.tasks.length === 1 ? " task" : " tasks") +
      (b.blockers.length
        ? ' · <span class="b-blockers">' + b.blockers.length + " blocker" + (b.blockers.length > 1 ? "s" : "") + "</span>"
        : "");
    head += '<span class="meta">' + meta + '</span></header>';

    let body = head;
    if (b.tasks.length === 0) {
      body += '<div class="board-body-note">No tasks yet.</div>';
    } else {
      body += '<div class="table-scroll"><table class="board-table"><thead><tr>' +
        '<th>#</th><th>Title</th><th>Agent</th><th>Status</th><th>Blocked by</th>' +
        '</tr></thead><tbody>';
      for (const t of b.tasks) {
        body += '<tr tabindex="0" data-repo="' + escapeHtml(b.repo) + '" data-task="' + escapeHtml(t.num) + '"' +
          ' title="view trace chain for task ' + escapeHtml(t.num) + '">' +
          '<td class="num">' + escapeHtml(t.num) + '</td>' +
          '<td class="title">' + escapeHtml(t.title) + '</td>' +
          '<td class="agent">' + escapeHtml(t.agent) + '</td>' +
          '<td>' + statusHtml(t.status, t.status_keyword) + '</td>' +
          '<td class="blocked-by">' + escapeHtml(t.blocked_by) + '</td>' +
          '</tr>';
      }
      body += '</tbody></table></div>';
    }

    if (b.blockers.length) {
      body += '<div class="blockers">';
      for (const bl of b.blockers) {
        body += '<div class="blocker"><span class="bid">' + escapeHtml(bl.id) + '</span> ' +
          escapeHtml(bl.description) +
          ' <span class="bmeta">(task ' + escapeHtml(bl.task) + ' · ' + escapeHtml(bl.status) +
          ' · since ' + escapeHtml(bl.since) + ')</span></div>';
      }
      body += '</div>';
    }
    card.innerHTML = body;
    host.appendChild(card);
  }
}

function setFooter(text, isErr) {
  const footer = document.getElementById("footer");
  document.getElementById("footer-text").textContent = text;
  footer.classList.toggle("err", !!isErr);
}

async function poll() {
  try {
    const res = await fetch("/api/state", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    render(await res.json());
    setFooter("ml-os · read-only · updated " + new Date().toLocaleTimeString(), false);
  } catch (e) {
    setFooter("ml-os · connection lost (" + e.message + ") — retrying", true);
  }
}

// ── Trace chain drawer ──
const drawer = document.getElementById("chain-drawer");
const backdrop = document.getElementById("chain-backdrop");

function closeChain() {
  drawer.classList.remove("open");
  backdrop.classList.remove("open");
  drawer.setAttribute("aria-hidden", "true");
}

function openChain(repo, task) {
  const title = document.getElementById("chain-title");
  const body = document.getElementById("chain-body");
  title.innerHTML = escapeHtml(repo) + ' <span class="tnum">#' + escapeHtml(task) + '</span>';
  body.innerHTML = '<div class="chain-empty">loading…</div>';
  drawer.classList.add("open");
  backdrop.classList.add("open");
  drawer.setAttribute("aria-hidden", "false");

  fetch("/api/task?repo=" + encodeURIComponent(repo) + "&task=" + encodeURIComponent(task), { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(renderChain)
    .catch(e => { body.innerHTML = '<div class="chain-empty err">could not load chain (' + escapeHtml(e.message) + ')</div>'; });
}

// Causal order: plan → handoffs → commits (the walkable chain, per spec).
function renderChain(chain) {
  const body = document.getElementById("chain-body");
  let html = '<div class="tl">';

  html += '<section class="tl-node n-plan"><span class="tl-dot"></span>' +
    '<h4>Plan' + (chain.plan_files.length ? ' <span class="n">· ' + chain.plan_files.length + '</span>' : '') + '</h4>';
  if (chain.plan_files.length === 0) html += '<div class="chain-empty">No plan folder for this task.</div>';
  else for (const f of chain.plan_files)
    html += '<details class="plan-file" open><summary>' + escapeHtml(f.name) + '</summary><pre>' +
      escapeHtml(f.content) + '</pre></details>';
  html += '</section>';

  html += '<section class="tl-node n-handoff"><span class="tl-dot"></span>' +
    '<h4>Handoffs' + (chain.handoffs.length ? ' <span class="n">· ' + chain.handoffs.length + '</span>' : '') + '</h4>';
  if (chain.handoffs.length === 0) html += '<div class="chain-empty">No handoffs for this task.</div>';
  else for (const h of chain.handoffs)
    html += '<div class="handoff-card"><div class="hmeta">' + escapeHtml(h.from) +
      ' <span class="arrow">→</span> ' + escapeHtml(h.to) +
      (h.date ? ' · ' + escapeHtml(h.date) : '') + '</div><div>' + escapeHtml(h.summary) + '</div>' +
      (h.detail ? '<div class="hdetail">' + escapeHtml(h.detail) + '</div>' : '') + '</div>';
  html += '</section>';

  html += '<section class="tl-node n-commit"><span class="tl-dot"></span>' +
    '<h4>Commits' + (chain.commits.length ? ' <span class="n">· ' + chain.commits.length + '</span>' : '') + '</h4>';
  if (chain.commits.length === 0) html += '<div class="chain-empty">No commits recorded.</div>';
  else for (const c of chain.commits)
    html += '<div class="commit"><span class="sha">' + escapeHtml(c.commit) + '</span><span>' +
      escapeHtml(c.title || "") + '</span></div>';
  html += '</section></div>';

  body.innerHTML = html;
}

// Jump to a repo's waiting session (read-only + jump; approval happens in-session).
async function jump(repo) {
  try {
    const res = await fetch("/api/jump", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ repo }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    setFooter("ml-os · jumped to " + repo + "'s session", false);
  } catch (e) {
    setFooter("ml-os · jump to " + repo + " failed (" + e.message + ")", true);
  }
}

// Delegated routing: chain affordance → drawer; board row → drawer; gate → jump.
function route(target) {
  const chainEl = target.closest("[data-chain-repo]");
  if (chainEl) { openChain(chainEl.dataset.chainRepo, chainEl.dataset.chainTask); return true; }
  const boardEl = target.closest("tr[data-task]");
  if (boardEl && boardEl.dataset.repo) { openChain(boardEl.dataset.repo, boardEl.dataset.task); return true; }
  const jumpEl = target.closest("[data-jump-repo]");
  if (jumpEl) { jump(jumpEl.dataset.jumpRepo); return true; }
  return false;
}

document.addEventListener("click", e => { route(e.target); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeChain(); return; }
  if ((e.key === "Enter" || e.key === " ") &&
      e.target instanceof Element && e.target.matches("[data-jump-repo], tr[data-task]")) {
    e.preventDefault();
    route(e.target);
  }
});
document.getElementById("chain-close").addEventListener("click", closeChain);
backdrop.addEventListener("click", closeChain);

poll();
setInterval(poll, 5000);  // ~5s staleness budget (spec)
</script>
</body>
</html>
